name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LeadsHunter API
        run: |
          curl -s -f -m 30 "https://leadshunter-api.onrender.com/api/status" || echo "Ping failed or server starting"
