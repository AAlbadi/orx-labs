services:
  - type: web
    name: leadshunter-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APOLLO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
